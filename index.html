<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tic-tac-toe</title>
    <style>
      .board {
        display: grid;
        grid-template-columns: repeat(3, 5rem);
        gap: 0.25rem;
      }
      .board button {
        width: 5rem;
        height: 5rem;
        font-size: 3rem;
      }
    </style>
  </head>
  <body>
    <h1>Tic-tac-toe</h1>
    <div id="game"></div>
    <script type="module">
      import { mount } from "./src/ui.js";
      mount(document.getElementById("game"));
    </script>
  </body>
</html>
